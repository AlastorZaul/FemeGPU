<div class="login-wrapper">
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <mat-card class="login-card">

    <mat-card-header class="login-header">
      <div class="logo-container" [class.active]="!isLoading()">
        <mat-icon>{{ isLoading() ? 'hourglass_empty' : 'developer_board' }}</mat-icon>
      </div>
      <mat-card-title>Ferme GPU</mat-card-title>
      <mat-card-subtitle>Connexion sécurisée au cluster</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Identifiant / Email</mat-label>
          <input matInput [(ngModel)]="username" name="username" [disabled]="isLoading()" required>
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" [disabled]="isLoading()">
          <mat-icon matSuffix>key</mat-icon>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="isLoading() || !username" class="submit-btn">
          @if (isLoading()) {
            <mat-spinner diameter="20" color="accent"></mat-spinner>
            <span>Connexion...</span>
          } @else {
            <ng-container>
              <span>Se connecter</span>
              <mat-icon>arrow_forward</mat-icon>
            </ng-container>
          }
        </button>
      </form>

    </mat-card-content>

    <mat-card-footer>
      <span class="version">Production v1.2</span>
    </mat-card-footer>
  </mat-card>
</div>
