<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>GPU Farm Login</mat-card-title>
      <mat-card-subtitle>Accédez à votre tableau de bord</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="exemple@domaine.com">
          @if (loginForm.get('email')?.hasError('email')) {
            <mat-error>Veuillez entrer une adresse email valide.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Mot de passe</mat-label>
          <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
          Se connecter
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
