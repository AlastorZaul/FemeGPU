<div class="login-wrapper">
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <div class="logo-container">
        <mat-icon>developer_board</mat-icon>
      </div>
      <mat-card-title>Qui est-ce ?</mat-card-title>
      <mat-card-subtitle>Choisissez un profil pour la démo</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="user-grid">
        @for (user of users; track user.username) {
          <button class="user-card-btn" (click)="login(user)">
            <div class="avatar-circle" [ngClass]="user.roles[0].toLowerCase()">
              <mat-icon>{{ user.icon }}</mat-icon>
            </div>
            <div class="user-info">
              <span class="name">{{ user.username }}</span>
              <span class="role-badge" [ngClass]="user.roles[0].toLowerCase()">
                {{ user.roles[0] }}
              </span>
              <span class="desc">{{ user.description }}</span>
            </div>
            <mat-icon class="chevron">chevron_right</mat-icon>
          </button>
        }
      </div>
    </mat-card-content>

    <mat-card-footer>
      <span class="version">Demo Environment v1.1</span>
    </mat-card-footer>
  </mat-card>
</div>
