<div class="page-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Gestion des Gateways</mat-card-title>
      <mat-card-subtitle>Liste de toutes les gateways réseau configurées</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z4">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Nom de la Gateway </th>
          <td mat-cell *matCellDef="let gw"> {{gw.name}} </td>
        </ng-container>

        <ng-container matColumnDef="ipAddress">
          <th mat-header-cell *matHeaderCellDef> Adresse IP </th>
          <td mat-cell *matCellDef="let gw"> {{gw.ipAddress}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Statut </th>
          <td mat-cell *matCellDef="let gw">
            <mat-chip-listbox>
              <mat-chip [color]="gw.status === 'Online' ? 'primary' : 'warn'" selected>{{gw.status}}</mat-chip>
            </mat-chip-listbox>
          </td>
        </ng-container>
        
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let gw">
            <button mat-icon-button color="primary" aria-label="Modifier la gateway">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" aria-label="Supprimer la gateway">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
